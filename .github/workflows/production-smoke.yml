name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Netlify frontend URL
        required: true
        default: https://crewpilotos.netlify.app
      api_url:
        description: Render API URL
        required: true
        default: https://crewpilotos.onrender.com
      check_readiness:
        description: Also require /api/v1/ready to pass (includes migration drift check)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check frontend
        run: |
          curl --fail --silent --show-error --location --retry 5 \
            --retry-all-errors --retry-connrefused --retry-delay 5 --max-time 30 \
            "${{ inputs.frontend_url }}" > /tmp/frontend.html
          grep -qi "CrewPilot OS" /tmp/frontend.html

      - name: Check API root
        run: |
          curl --fail --silent --show-error --retry 5 \
            --retry-all-errors --retry-connrefused --retry-delay 5 --max-time 30 \
            "${{ inputs.api_url }}/" | grep -qi "CrewPilot OS API"

      - name: Check API health
        run: |
          curl --fail --silent --show-error --retry 5 \
            --retry-all-errors --retry-connrefused --retry-delay 5 --max-time 30 \
            "${{ inputs.api_url }}/api/v1/health" | grep -q '"ok"'

      - name: Check API status is consistent
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          url = "${{ inputs.api_url }}/api/v1/status"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          assert data["status"] == "ok", data
          assert data["checks"]["database"]["status"] == "ok", data
          assert data["checks"]["migrations"]["status"] == "ok", data
          assert (
              data["checks"]["migrations"]["current"]
              == data["checks"]["migrations"]["head"]
          ), data
          print("API status OK:", json.dumps(data))
          EOF

      - name: Check API readiness
        if: ${{ inputs.check_readiness }}
        run: |
          curl --fail --silent --show-error --retry 5 \
            --retry-all-errors --retry-connrefused --retry-delay 5 --max-time 30 \
            "${{ inputs.api_url }}/api/v1/ready" | grep -q '"ready"'